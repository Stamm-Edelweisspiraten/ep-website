# CI der Stammeswebsite (eigenes Repo seit 2026-11-01; Backend = Kalypzo Atrium mit Modulen aus ep-intern-modules)
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: website (Check, Tests, Build, Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung (keine Fehler erlaubt)
        # Seit 2026-11-20 ohne Fehler (Leaflet entfernt) – jeder neue Fehler bricht ab.
        run: |
          set +e
          npx svelte-kit sync
          npx svelte-check --tsconfig ./tsconfig.json --output machine > svelte-check.log
          tail -n 1 svelte-check.log
          errors=$(grep -E '^[0-9]+ COMPLETED' svelte-check.log | sed -E 's/.* ([0-9]+) ERRORS.*/\1/')
          if [ -z "$errors" ]; then echo "svelte-check lieferte kein Ergebnis"; exit 1; fi
          if [ "$errors" -gt 0 ]; then
            grep ' ERROR ' svelte-check.log
            echo "svelte-check meldet $errors Fehler"
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - name: Audit aller Abhängigkeiten (High/Critical blockieren, Ausnahmen in scripts/audit.mjs)
        # Auch devDependencies: SvelteKit/Vite landen im gebauten Server.
        run: node scripts/audit.mjs high
