<!doctype html>
<html lang="de" class="%ep.theme%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)" />
		<script nonce="%sveltekit.nonce%">
			// Ohne eigene Wahl (Cookie `theme`) der Systemeinstellung folgen – vor dem ersten Zeichnen, damit nichts aufblitzt
			(function () {
				try {
					var d = document.documentElement;
					if (!d.classList.contains('light') && !d.classList.contains('dark') && matchMedia('(prefers-color-scheme: dark)').matches) {
						d.classList.add('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
